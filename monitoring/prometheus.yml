# TripClip AI — Prometheus scrape config
# Tüm target'lar app-network Docker network'ü içinde, host'a hiç port açılmaz.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "core-api"
    static_configs:
      - targets: ["core-api:8000"]

  - job_name: "web-bff"
    static_configs:
      - targets: ["web-bff:8002"]

  - job_name: "mobile-bff"
    static_configs:
      - targets: ["mobile-bff:8001"]

  - job_name: "celery-worker"
    static_configs:
      - targets: ["celery-worker:9808"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
