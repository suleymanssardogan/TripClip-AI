name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  test-deploy:
    name: Deployment failure handling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/*.sh

  test-ios:
    name: iOS Tests
    timeout-minutes: 20
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run XCTest
        run: xcodebuild -project ios/TripClipApp.xcodeproj -scheme TripClipApp -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -test-timeouts-enabled YES -default-test-execution-time-allowance 60 CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test

  test-integration:
    name: Real infrastructure resilience
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL, Redis, Celery and Qdrant fault tests
        run: ./scripts/test-integration.sh
      - name: Upload integration reports and worker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-resilience
          path: integration-reports/
          if-no-files-found: warn

  # ── Backend Tests ────────────────────────────────────────────────────────────
  test-core-api:
    name: Core API Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/core-api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install CPU-only PyTorch first to avoid downloading CUDA wheels (~2GB)
      - name: Install CPU-only PyTorch
        run: |
          pip install \
            torch==2.1.1+cpu \
            torchvision==0.16.1+cpu \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r services/core-api/requirements.txt

      - name: Run tests
        working-directory: services/core-api
        env:
          JWT_SECRET_KEY: ci-test-secret-not-for-production
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/1
          MONGODB_URL: mongodb://localhost:27017/tripclip_test
          PYTHONPATH: .
        run: pytest tests/ -v --tb=short

  # ── BFF Tests ────────────────────────────────────────────────────────────────
  test-bff:
    name: BFF Tests (web-bff, mobile-bff)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [web-bff, mobile-bff]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(format('services/{0}/requirements.txt', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          JWT_SECRET_KEY: ci-test-secret-not-for-production
          CORE_API_URL: http://core-api-test:8000
          PYTHONPATH: .
        run: pytest tests/ -v --tb=short

  # ── Web Lint ─────────────────────────────────────────────────────────────────
  lint-web:
    name: Web Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Lint
        working-directory: web
        run: npm run lint -- --max-warnings=0

  # ── Security: .dockerignore coverage check ───────────────────────────────────
  # Runs on every push/PR to catch credentials leaking into build context.
  security-dockerignore:
    name: Credentials not in build context
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify credentials excluded from core-api build context
        run: |
          # Create a fake credentials file to test exclusion
          mkdir -p services/core-api/credentials
          echo '{"type":"service_account"}' > services/core-api/credentials/test.json

          # Build with --no-cache and check the image does NOT contain credentials/
          docker build \
            --no-cache \
            --tag tripclip/core-api:security-check \
            services/core-api

          # Attempt to find the credential path in the image filesystem
          if docker run --rm tripclip/core-api:security-check \
               test ! -e /app/credentials/test.json; then
            echo "✅ credentials/ correctly excluded from image"
          else
            echo "❌ SECURITY FAILURE: credentials present or container check failed"
            exit 1
          fi

          docker rmi tripclip/core-api:security-check

  # ── Docker Build Verification ─────────────────────────────────────────────────
  # Runs on pull requests as well as main after tests pass.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-core-api, test-bff, lint-web, security-dockerignore, test-deploy, test-ios, test-integration]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build core-api
        uses: docker/build-push-action@v5
        with:
          context: services/core-api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: tripclip/core-api:ci

      - name: Build web-bff
        uses: docker/build-push-action@v5
        with:
          context: services/web-bff
          push: false
          tags: tripclip/web-bff:ci

      - name: Build mobile-bff
        uses: docker/build-push-action@v5
        with:
          context: services/mobile-bff
          push: false
          tags: tripclip/mobile-bff:ci

      - name: Build web
        uses: docker/build-push-action@v5
        with:
          context: web
          push: false
          tags: tripclip/web:ci
