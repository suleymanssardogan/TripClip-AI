# TripClip AI — Production Nginx Configuration
# Requirements: replace CHANGEME.example.com with your domain
# SSL certs must be placed in nginx/ssl/ (see docs/deployment.md)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Upstream pools
    upstream web_app  { server web:3000;     keepalive 16; }
    upstream web_bff  { server web-bff:8002; keepalive 16; }
    upstream mobile_bff { server mobile-bff:8001; keepalive 16; }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name CHANGEME.example.com;

        # SSL
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Security headers
        add_header X-Content-Type-Options   "nosniff"                            always;
        add_header X-Frame-Options          "DENY"                               always;
        add_header X-XSS-Protection         "1; mode=block"                      always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"    always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

        # Large uploads — video files up to 210MB (200MB limit + headroom)
        client_max_body_size 210M;

        # Timeouts tuned for video upload and async processing
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Common proxy headers (applied to all locations)
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ── Web BFF (/api/web/*) ─────────────────────────────────────────────
        location /api/web/ {
            proxy_pass http://web_bff;
        }

        # ── Mobile BFF (/api/mobile/*) ───────────────────────────────────────
        location /api/mobile/ {
            proxy_pass http://mobile_bff;
        }

        # ── Health check (unauthenticated, not logged) ────────────────────────
        location = /health {
            proxy_pass http://web_bff/health;
            access_log off;
        }

        # ── Next.js static assets (long-lived cache) ─────────────────────────
        location /_next/static/ {
            proxy_pass http://web_app;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ── Next.js web app (everything else) ────────────────────────────────
        location / {
            proxy_pass http://web_app;
            # WebSocket support for Next.js HMR (dev) — harmless in prod
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
