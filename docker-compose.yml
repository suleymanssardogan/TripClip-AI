services:
  # ── Veritabanları ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: tripclip-postgres
    environment:
      POSTGRES_USER: tripclip
      POSTGRES_PASSWORD: tripclip123
      POSTGRES_DB: tripclip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripclip -d tripclip"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tripclip-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tripclip-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"healthz check passed\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongodb:
    image: mongo:7
    container_name: tripclip-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Core API ──────────────────────────────────────────────────────────────
  core-api:
    build: ./services/core-api
    container_name: tripclip-core-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://tripclip:tripclip123@postgres:5432/tripclip
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/tripclip
      - UPLOAD_DIR=/app/uploads/videos
      - ALLOWED_ORIGINS=
      - ALLOWED_HOSTS=
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_SEND_FRAMES=${GEMINI_SEND_FRAMES:-true}
    volumes:
      - uploads_data:/app/uploads
      - ./services/core-api/app:/app/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Celery Worker ─────────────────────────────────────────────────────────
  celery-worker:
    build: ./services/core-api
    container_name: tripclip-celery-worker
    command: >
      celery -A app.core.celery_app worker
      --loglevel=info
      -Q video_processing
      --pool=solo
      -n worker@%h
    depends_on:
      core-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://tripclip:tripclip123@postgres:5432/tripclip
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/tripclip
      - UPLOAD_DIR=/app/uploads/videos
      - USE_GEMINI=true
      - USE_HYBRID=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_SEND_FRAMES=${GEMINI_SEND_FRAMES:-true}
      - WHISPER_MODEL=base
      - USE_GOOGLE_VISION=false
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-}
      - APNS_AUTH_KEY=${APNS_AUTH_KEY:-}
      - APNS_USE_SANDBOX=${APNS_USE_SANDBOX:-true}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    volumes:
      - uploads_data:/app/uploads
      - ./services/core-api/app:/app/app
    restart: unless-stopped

  # ── Mobile BFF ────────────────────────────────────────────────────────────
  mobile-bff:
    build: ./services/mobile-bff
    container_name: tripclip-mobile-bff
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      - CORE_API_URL=http://core-api:8000
      - ALLOWED_ORIGINS=
      - ALLOWED_HOSTS=
    volumes:
      - ./services/mobile-bff/app:/app/app

  # ── Web BFF ───────────────────────────────────────────────────────────────
  web-bff:
    build: ./services/web-bff
    container_name: tripclip-web-bff
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      - CORE_API_URL=http://core-api:8000
      - ALLOWED_ORIGINS=
      - ALLOWED_HOSTS=
    volumes:
      - ./services/web-bff/app:/app/app

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  qdrant_data:
  uploads_data:
