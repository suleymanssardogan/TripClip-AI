# TripClip AI — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# Required env: copy .env.example → .env and fill all values

services:

  # ── Nginx (single public entry point) ────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tripclip-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
      web-bff:
        condition: service_healthy
      mobile-bff:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Web (Next.js) ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
        NEXT_PUBLIC_LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
        LEGAL_CONTENT_APPROVED: ${LEGAL_CONTENT_APPROVED:-false}
    container_name: tripclip-web
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Databases ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tripclip-postgres
    restart: always
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-tripclip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripclip} -d ${POSTGRES_DB:-tripclip}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: tripclip-redis
    restart: always
    mem_limit: 512m
    cpus: 0.5
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mongodb:
    image: mongo:7.0.14
    container_name: tripclip-mongo
    restart: always
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD must be set}
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "$$MONGODB_ROOT_USERNAME", "--password", "$$MONGODB_ROOT_PASSWORD", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: tripclip-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Core API ──────────────────────────────────────────────────────────────────
  core-api:
    build:
      context: ./services/core-api
      # Build-time'da gömülen Whisper modelinin, runtime'daki WHISPER_MODEL
      # env değeriyle uyuşmasını sağlar — .env'de değiştirdiğinizde
      # `docker compose build` bunu otomatik kullanır, elle senkronize
      # etmenize gerek kalmaz.
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    container_name: tripclip-core-api
    restart: always
    # VPS kapasitesine göre ayarlayın — amaç, bu servisin bellek sızıntısı/
    # patlaması durumunda tüm host'u değil sadece kendini etkilemesi.
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_TOKEN_ENCRYPTION_KEY: ${APPLE_TOKEN_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripclip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-tripclip}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME must be set}:${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD must be set}@mongodb:27017/tripclip?authSource=admin
      MONGODB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME must be set}
      MONGODB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD must be set}
      UPLOAD_DIR: /app/uploads/videos
      RAW_UPLOAD_RETENTION_HOURS: ${RAW_UPLOAD_RETENTION_HOURS:-24}
      FAILED_UPLOAD_RETENTION_HOURS: ${FAILED_UPLOAD_RETENTION_HOURS:-168}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_PRICING_JSON: ${AI_PRICING_JSON:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      APP_ENV: production
      PRIVACY_REVIEWED_PROVIDERS: ${PRIVACY_REVIEWED_PROVIDERS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ALLOWED_HOSTS: core-api,web-bff,mobile-bff,localhost,127.0.0.1,${ALLOWED_HOSTS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@tripclip.app}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_REDIRECT_URIS: ${GOOGLE_ALLOWED_REDIRECT_URIS:-}
      AI_ASSISTANT_PROVIDER: ${AI_ASSISTANT_PROVIDER:-gemini}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      DAILY_UPLOAD_QUOTA_PER_USER: ${DAILY_UPLOAD_QUOTA_PER_USER:-20}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Independent of API availability; shares only SQL, broker and upload storage.
  maintenance:
    build:
      context: ./services/core-api
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    restart: always
    init: true
    mem_limit: 512m
    cpus: 0.5
    command: ["python", "-m", "app.tasks.maintenance"]
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_TOKEN_ENCRYPTION_KEY: ${APPLE_TOKEN_ENCRYPTION_KEY:-}
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripclip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-tripclip}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      UPLOAD_DIR: /app/uploads/videos
      RAW_UPLOAD_RETENTION_HOURS: ${RAW_UPLOAD_RETENTION_HOURS:-24}
      FAILED_UPLOAD_RETENTION_HOURS: ${FAILED_UPLOAD_RETENTION_HOURS:-168}
      MAINTENANCE_DISPATCH_INTERVAL: ${MAINTENANCE_DISPATCH_INTERVAL:-5}
      MAINTENANCE_RETENTION_INTERVAL: ${MAINTENANCE_RETENTION_INTERVAL:-900}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.maintenance", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./services/core-api
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    container_name: tripclip-celery-worker
    restart: always
    # ML modelleri (YOLO + BERT NER + Whisper + SentenceTransformer) HER
    # forked child process'te ayrı ayrı belleğe yüklenir (--concurrency=N
    # ≈ N× model belleği). Aşağıdaki 8g/4.0 concurrency=2 için ayarlanmıştır —
    # concurrency'yi artırırsanız her +1 için kabaca +3-4GB RAM / +1 cpu ekleyin,
    # VPS kapasitenize göre ayarlayın.
    mem_limit: 8g
    cpus: 4.0
    command: >
      sh -c "rm -rf /tmp/prometheus_multiproc && mkdir -p /tmp/prometheus_multiproc &&
      celery -A app.core.celery_app worker --loglevel=info -Q video_processing
      --pool=prefork --concurrency=2 -n worker@%h"
    depends_on:
      core-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripclip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-tripclip}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME must be set}:${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD must be set}@mongodb:27017/tripclip?authSource=admin
      UPLOAD_DIR: /app/uploads/videos
      RAW_UPLOAD_RETENTION_HOURS: ${RAW_UPLOAD_RETENTION_HOURS:-24}
      FAILED_UPLOAD_RETENTION_HOURS: ${FAILED_UPLOAD_RETENTION_HOURS:-168}
      USE_GEMINI: ${USE_GEMINI:-true}
      USE_HYBRID: ${USE_HYBRID:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_PRICING_JSON: ${AI_PRICING_JSON:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      USE_GOOGLE_VISION: ${USE_GOOGLE_VISION:-false}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      APP_ENV: production
      PRIVACY_REVIEWED_PROVIDERS: ${PRIVACY_REVIEWED_PROVIDERS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_AUTH_KEY: ${APNS_AUTH_KEY:-}
      APNS_USE_SANDBOX: ${APNS_USE_SANDBOX:-false}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d worker@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    expose:
      - "9808"  # Prometheus metrics — sadece app-network içinden erişilir

  # ── Web BFF ───────────────────────────────────────────────────────────────────
  web-bff:
    build: ./services/web-bff
    container_name: tripclip-web-bff
    restart: always
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      CORE_API_URL: http://core-api:8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      APP_ENV: production
      PRIVACY_REVIEWED_PROVIDERS: ${PRIVACY_REVIEWED_PROVIDERS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ALLOWED_HOSTS: core-api,web-bff,mobile-bff,localhost,127.0.0.1,${ALLOWED_HOSTS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Mobile BFF ────────────────────────────────────────────────────────────────
  mobile-bff:
    build: ./services/mobile-bff
    container_name: tripclip-mobile-bff
    restart: always
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      CORE_API_URL: http://core-api:8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      APP_ENV: production
      PRIVACY_REVIEWED_PROVIDERS: ${PRIVACY_REVIEWED_PROVIDERS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ALLOWED_HOSTS: core-api,web-bff,mobile-bff,localhost,127.0.0.1,${ALLOWED_HOSTS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Monitoring: Prometheus + Grafana ──────────────────────────────────────────
  # Public'e HİÇ port açılmaz — nginx bu servisleri proxy'lemez. Sadece
  # 127.0.0.1'e bağlanır; erişim için SSH tünel kullanın:
  #   ssh -L 9090:localhost:9090 -L 3010:localhost:3010 kullanici@sunucu
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tripclip-prometheus
    restart: always
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: tripclip-grafana
    restart: always
    mem_limit: 512m
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - prometheus
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  qdrant_data:
  uploads_data:
  prometheus_data:
  grafana_data:
